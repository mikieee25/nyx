[package]
name = "nyx"
version = "0.1.0"
description = "Nyx local game launcher"
authors = ["Nyx"]
edition = "2021"

[lib]
name = "nyx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
